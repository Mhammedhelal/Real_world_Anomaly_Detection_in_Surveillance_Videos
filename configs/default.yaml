# Configuration for Real-world Anomaly Detection in Surveillance Videos

# Dataset Configuration
dataset:
  input_video_dir: 'data/videos/normal'
  output_base_dir: 'data/features'
  features_dir_name: 'extracted'
  collate_type: 'variable_length'
  collate_fixed_length: 128

  # Frame processing  (use list, not tuple string — avoids YAML parsing issues)
  frame_size: [224, 224]
  segment_length: 16
  fps: 30
  max_frames: 3000

  # Normalisation (ImageNet defaults)
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

  # Video file extensions
  video_extensions: ['.avi', '.mp4', '.mov', '.mkv', '.flv', '.wmv']

# Feature Extraction Configuration
feature_extraction:
  motion_extractor: 'i3d'
  target_fps: 8

  i3d_pretrained: true
  i3d_frozen: true
  i3d_feature_dim: 2048

  yolo_model_name: 'yolov8n.pt'
  yolo_feature_dim: 83

  normalize: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std:  [0.229, 0.224, 0.225]

# Model Architecture Configuration
model:
  input_size: 2131          # 2048 (I3D) + 83 (YOLO)
  hidden_size: 256
  num_classes: 14           # 13 crime types + Normal
  bidirectional: true

# Training Configuration
training:
  batch_size: 32
  num_epochs: 100
  shuffle: true
  num_workers: 4
  pin_memory: true

# Loss Function Configuration
loss:
  lambda_smoothness: 8.0e-5
  lambda_sparsity:   8.0e-5
  margin: 1.0

# Hardware Configuration
hardware:
  device: 'cuda'
  mixed_precision: false

# Logging Configuration
logging:
  log_interval: 10          # print batch stats every N batches
  save_interval: 50         # save checkpoint every N epochs
  checkpoint_dir: 'outputs/checkpoints'
  log_dir: 'outputs/logs'

# Optimizer Configuration
optimizer:
  type: 'adadelta'
  learning_rate: 1.0
  rho: 0.9
  eps: 1.0e-6

# Label taxonomy for UCF-Crime dataset
labels:
  ucf_crime_categories:
    0: 'Normal'
    1: 'Abuse'
    2: 'Arrest'
    3: 'Arson'
    4: 'Assault'
    5: 'Burglary'
    6: 'Explosion'
    7: 'Fighting'
    8: 'Robbery'
    9: 'Shooting'
    10: 'Shoplifting'
    11: 'Stealing'
    12: 'Vandalism'
    13: 'RoadAccidents'
