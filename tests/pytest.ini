[pytest]
minversion = 7.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    determinism: Tests for eval mode determinism
    device: Tests for CPU/CUDA device handling
    gradient: Tests for gradient flow and backward pass
    edge_case: Tests for edge cases and boundary conditions
    integration: Integration tests across components
    slow: Tests that take significant time
    cuda: Tests requiring CUDA/GPU
timeout = 300
log_cli = false
log_cli_level = WARNING
