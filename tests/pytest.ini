[pytest]
# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Custom markers for test categorization
markers =
    determinism: Tests for eval mode determinism (critical for reproducibility)
    device: Tests for device handling (CPU/CUDA)
    gradient: Tests for gradient flow and backward pass
    edge_case: Tests for edge cases and boundary conditions
    integration: Integration tests across components
    slow: Tests that take significant time
    cuda: Tests requiring CUDA/GPU

# Timeout for tests (requires pytest-timeout)
timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
