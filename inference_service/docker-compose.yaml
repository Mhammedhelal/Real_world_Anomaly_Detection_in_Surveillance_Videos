version: '3.8'

services:
  anomaly-detector:
    build:
      context: .. # project root — needed for src/ and configs/
      dockerfile: inference_service/Dockerfile
    container_name: anomaly-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro # mount trained model (read-only)
      - ./data/features:/app/data/features
      - ./data/metadata:/app/data/metadata
    environment:
      # Model
      - MODEL_CHECKPOINT=/app/models/best_model.pt
      - INPUT_SIZE=2131
      - HIDDEN_SIZE=256
      - NUM_CLASSES=14
      # Preprocessing
      - FRAME_WIDTH=224
      - FRAME_HEIGHT=224
      - SEGMENT_LENGTH=16
      # Inference
      - ANOMALY_THRESHOLD=0.5 # override after calibration
      - DEVICE=cuda # change to 'cpu' for CPU-only
      - LOCALIZER_STRATEGY=object # 'object' or 'region'
      # Storage
      - FEATURES_DIR=/app/data/features
      - METADATA_DIR=/app/data/metadata
      # Feature extraction
      - YOLO_MODEL=yolov8n.pt
      - TARGET_FPS=8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# CPU-only: comment out the deploy.resources block above and set DEVICE=cpu
